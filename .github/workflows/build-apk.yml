name: Build APK

on:
  workflow_dispatch:   # permite clicar em "Run workflow" manualmente
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decodificar a keystore (vinda do Secret)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "KEYSTORE_PATH=$(pwd)/keystore.jks" >> $GITHUB_ENV

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Rodar build de release
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Subir o APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: sims4translator-apk
          path: app/build/outputs/apk/release/app-release.apk
