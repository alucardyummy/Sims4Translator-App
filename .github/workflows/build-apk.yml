name: Build APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versao (ex: v1.0)'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Definir versao
        run: echo "APP_VERSION=${{ github.event.inputs.version || github.ref_name }}" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
          echo "KEYSTORE_PATH=$(pwd)/keystore.jks" >> $GITHUB_ENV

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - run: cp app/build/outputs/apk/release/app-release.apk sims4translator-${{ env.APP_VERSION }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.APP_VERSION }}
          name: "Sims 4 Translator ${{ env.APP_VERSION }}"
          files: sims4translator-${{ env.APP_VERSION }}.apk
